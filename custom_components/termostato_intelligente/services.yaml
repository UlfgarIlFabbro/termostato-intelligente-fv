adjust_target:
  name: Regola target temperatura
  description: >-
    Aumenta o diminuisce il target di temperatura (giorno o notte, in base
    all'orario corrente) di un termostato in modo Semplice o Semplice+FV.
    La regolazione è immediata e non ricarica l'integrazione — resta valida
    finché non la cambi di nuovo o modifichi la configurazione da wizard.
  fields:
    entity_id:
      name: Termostato
      description: L'entità termostato da regolare.
      required: true
      selector:
        entity:
          integration: termostato_intelligente
          domain: climate
    delta:
      name: Variazione
      description: Quanti gradi aggiungere (positivo) o togliere (negativo) al target attuale.
      required: true
      default: 1
      selector:
        number:
          min: -10
          max: 10
          step: 0.5
          mode: box

adjust_priority:
  name: Regola priorità fotovoltaico
  description: >-
    Aumenta o diminuisce la priorità FV di un termostato in modo
    Semplice+FV (numero più basso = priorità più alta, si accende prima).
    Non scende mai sotto 1. La regolazione è immediata e non ricarica
    l'integrazione.
  fields:
    entity_id:
      name: Termostato
      description: L'entità termostato da regolare.
      required: true
      selector:
        entity:
          integration: termostato_intelligente
          domain: climate
    delta:
      name: Variazione
      description: Di quanto aumentare (positivo) o diminuire (negativo) la priorità attuale.
      required: true
      default: 1
      selector:
        number:
          min: -20
          max: 20
          step: 1
          mode: box

set_shutoff_timer:
  name: Imposta timer di spegnimento
  description: >-
    Programma lo spegnimento automatico del climatizzatore dopo un numero
    di minuti, indipendentemente dal master switch dell'automazione — utile
    per un uso manuale (es. uno scaldotto). Impostare 0 minuti annulla un
    timer già attivo senza spegnere nulla.
  fields:
    entity_id:
      name: Termostato
      description: L'entità termostato su cui impostare il timer.
      required: true
      selector:
        entity:
          integration: termostato_intelligente
          domain: climate
    minutes:
      name: Minuti
      description: Tra quanti minuti spegnere. 0 annulla un timer già attivo.
      required: true
      default: 30
      selector:
        number:
          min: 0
          max: 480
          step: 5
          mode: box

toggle_manual_shutoff_timer:
  name: Attiva/disattiva timer di spegnimento manuale
  description: >-
    Attiva o disattiva la funzione "spegni dopo X minuti da un'accensione
    manuale" per questo termostato — usata dalla card per il pulsante
    interruttore dedicato.
  fields:
    entity_id:
      name: Termostato
      description: L'entità termostato su cui attivare/disattivare la funzione.
      required: true
      selector:
        entity:
          integration: termostato_intelligente
          domain: climate
    enabled:
      name: Attivo
      description: True per attivare, false per disattivare.
      required: true
      default: true
      selector:
        boolean: {}

adjust_manual_shutoff_timer_minutes:
  name: Regola minuti timer di spegnimento manuale
  description: >-
    Aumenta o diminuisce i minuti del timer di spegnimento dopo
    accensione manuale. Non scende mai sotto 5.
  fields:
    entity_id:
      name: Termostato
      description: L'entità termostato da regolare.
      required: true
      selector:
        entity:
          integration: termostato_intelligente
          domain: climate
    delta:
      name: Variazione
      description: Di quanti minuti aumentare (positivo) o diminuire (negativo) il valore attuale.
      required: true
      default: 5
      selector:
        number:
          min: -60
          max: 60
          step: 5
          mode: box

set_season_mode:
  name: Imposta modalità stagionale
  description: >-
    Cambia la modalità stagionale (Estate/Inverno/Auto/Manuale/Off) e la
    salva permanentemente in configurazione — l'integrazione si ricarica
    automaticamente per applicarla subito.
  fields:
    entity_id:
      name: Termostato
      description: L'entità termostato da cambiare.
      required: true
      selector:
        entity:
          integration: termostato_intelligente
          domain: climate
    season:
      name: Stagione
      description: estate / inverno / auto / manuale / off
      required: true
      selector:
        select:
          options:
            - estate
            - inverno
            - auto
            - manuale
            - "off"
